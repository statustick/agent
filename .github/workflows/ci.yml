name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ci-${{ github.ref }}-${{ github.event.action == 'edited' && 'title' || 'code' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check that the title is a Conventional Commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$TITLE" | grep -qE '^(feat|fix|perf|revert|docs|refactor|test|build|ci|chore|style)(\((agent|checks|browser|sandbox|chart|docs|deps|deps-dev)\))?!?: [a-z]' \
            || { echo "Title must be type(scope): summary, e.g. 'fix(checks): retry DNS once'. See CONTRIBUTING.md."; exit 1; }
          if printf '%s\n' "$TITLE" | grep -qE '\b[A-Z][A-Z0-9]+-[0-9]+\b'; then echo "Title must not name a tracker ticket id."; exit 1; fi

  rust:
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: rustup toolchain install stable --profile minimal -c clippy,rustfmt && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo sysctl -w net.ipv4.ping_group_range="0 2147483647"
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: npm ci --ignore-scripts
        working-directory: sandbox
      - run: cargo test --workspace --all-features

  deny:
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  sandbox:
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sandbox
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sandbox/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test

  chart:
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: helm lint --strict charts/statustick-agent --set existingSecret.name=statustick-agent
      - name: Render the optional settings
        run: |
          helm template t charts/statustick-agent --set existingSecret.name=s \
            --set ping.enabled=true --set ping.netRaw=true \
            --set proxy.existingSecret.name=proxy --set proxy.noProxy=.corp.example \
            --set extraCA.configMap=corp-ca
          helm template t charts/statustick-agent --set existingSecret.name=s \
            --set replicaCount=1 --set buffer.persistence.enabled=true --set extraCA.secret=corp-ca
          helm template t charts/statustick-agent --set existingSecret.name=s \
            --set metrics.enabled=true --set metrics.serviceMonitor.enabled=true --set metrics.share=false
          if helm template t charts/statustick-agent; then echo "rendered without existingSecret.name"; exit 1; fi
          if helm template t charts/statustick-agent --set existingSecret.name=s --set replicaCount=2; then
            echo "rendered two replicas with one token"; exit 1
          fi
