name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Publish the image and binaries of this released agent version again (X.Y.Z)
        required: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    outputs:
      agent: ${{ steps.release.outputs.release_created }}
      agent-tag: ${{ steps.release.outputs.tag_name }}
      agent-version: ${{ steps.release.outputs.version }}
      chart: ${{ steps.release.outputs['charts/statustick-agent--release_created'] }}
      chart-version: ${{ steps.release.outputs['charts/statustick-agent--version'] }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: always() && (needs.release-please.outputs.agent == 'true' || inputs.version != '')
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ${{ vars.AGENT_IMAGE || 'ghcr.io/statustick/agent' }}
      VERSION: ${{ inputs.version || needs.release-please.outputs.agent-version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent-v${{ inputs.version || needs.release-please.outputs.agent-version }}
      - name: Pull Docker Hub images through a mirror
        run: |
          echo '{"registry-mirrors": ["https://mirror.gcr.io"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
      - name: Check that the release matches version.txt
        run: '[ "$(cat version.txt)" = "$VERSION" ] || { echo "version.txt is not $VERSION"; exit 1; }'
      - uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Build the static binary
        uses: docker/build-push-action@v7
        with:
          context: .
          target: binary-export
          platforms: linux/${{ matrix.arch }}
          outputs: type=local,dest=dist
          cache-from: type=gha,scope=agent-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=agent-${{ matrix.arch }}
      - name: Package the binary
        run: |
          file dist/statustick-agent | grep -q 'statically linked'
          tar -czf "statustick-agent-linux-${{ matrix.arch }}.tar.gz" -C dist statustick-agent
      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.arch }}
          path: statustick-agent-linux-${{ matrix.arch }}.tar.gz
      - name: Build the image for the checks
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: agent-scan:ci
          cache-from: type=gha,scope=agent-${{ matrix.arch }}
      - run: scripts/agent-isolation.sh agent-scan:ci
      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: agent-scan:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        name: Push the image by digest
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          sbom: true
          provenance: mode=max
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=agent-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=agent-${{ matrix.arch }}
      - run: echo "${{ steps.push.outputs.digest }}" > digest-${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: digest-${{ matrix.arch }}

  image:
    needs: [release-please, build]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE: ${{ vars.AGENT_IMAGE || 'ghcr.io/statustick/agent' }}
      VERSION: ${{ inputs.version || needs.release-please.outputs.agent-version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: sigstore/cosign-installer@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ env.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.VERSION }}
            type=semver,pattern={{major}},value=${{ env.VERSION }}
            type=raw,value=latest
      - name: Publish the multi-platform image
        run: |
          tags=()
          while read -r tag; do tags+=(-t "$tag"); done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          docker buildx imagetools create "${tags[@]}" "$IMAGE@$(cat digest-amd64)" "$IMAGE@$(cat digest-arm64)"
          docker buildx imagetools inspect "$IMAGE:$VERSION"
      - name: Sign the image
        run: cosign sign --yes "$IMAGE@$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)"

  binaries:
    needs: [release-please, build]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      TAG: agent-v${{ inputs.version || needs.release-please.outputs.agent-version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          merge-multiple: true
      - name: Attach the static binaries to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum statustick-agent-linux-*.tar.gz > SHA256SUMS
          gh release upload "$TAG" statustick-agent-linux-*.tar.gz SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"

  chart:
    needs: release-please
    if: needs.release-please.outputs.chart == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ${{ vars.CHART_REGISTRY || 'ghcr.io/statustick/charts' }}
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: helm lint --strict charts/statustick-agent --set existingSecret.name=statustick-agent
      - run: helm package charts/statustick-agent --destination dist
      - name: Push the chart to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm push dist/statustick-agent-*.tgz "oci://${REGISTRY}"
