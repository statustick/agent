name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Publish the image of this released agent version again (X.Y.Z)
        required: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    outputs:
      agent: ${{ steps.release.outputs.release_created }}
      agent-tag: ${{ steps.release.outputs.tag_name }}
      agent-version: ${{ steps.release.outputs.version }}
      chart: ${{ steps.release.outputs['charts/statustick-agent--release_created'] }}
      chart-version: ${{ steps.release.outputs['charts/statustick-agent--version'] }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  image:
    needs: release-please
    if: always() && (needs.release-please.outputs.agent == 'true' || inputs.version != '')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE: ${{ vars.AGENT_IMAGE || 'ghcr.io/statustick/agent' }}
      VERSION: ${{ inputs.version || needs.release-please.outputs.agent-version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent-v${{ inputs.version || needs.release-please.outputs.agent-version }}
      - name: Pull Docker Hub images through a mirror
        run: |
          echo '{"registry-mirrors": ["https://mirror.gcr.io"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
      - name: Check that the release matches version.txt
        run: '[ "$(cat version.txt)" = "$VERSION" ] || { echo "version.txt is not $VERSION"; exit 1; }'
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - uses: sigstore/cosign-installer@v3
      - name: Build the image for the scan
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: agent-scan:ci
          cache-from: type=gha,scope=agent-image
      - run: scripts/agent-isolation.sh agent-scan:ci
      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: agent-scan:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ env.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.VERSION }}
            type=semver,pattern={{major}},value=${{ env.VERSION }}
            type=raw,value=latest
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=agent-image
      - name: Sign the image
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"

  binaries:
    needs: release-please
    if: needs.release-please.outputs.agent == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.agent-tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: binary-export
          platforms: linux/amd64,linux/arm64
          outputs: type=local,dest=dist
          cache-from: type=gha,scope=agent-binary
          cache-to: type=gha,mode=max,scope=agent-binary
      - name: Attach the static binaries to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          for arch in amd64 arm64; do
            file "linux_$arch/statustick-agent" | grep -q 'statically linked'
            tar -czf "statustick-agent-linux-$arch.tar.gz" -C "linux_$arch" statustick-agent
          done
          sha256sum statustick-agent-linux-*.tar.gz > SHA256SUMS
          gh release upload "$TAG" statustick-agent-linux-*.tar.gz SHA256SUMS --repo "$GITHUB_REPOSITORY"

  chart:
    needs: release-please
    if: needs.release-please.outputs.chart == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ${{ vars.CHART_REGISTRY || 'ghcr.io/statustick/charts' }}
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
      - run: helm lint --strict charts/statustick-agent --set existingSecret.name=statustick-agent
      - run: helm package charts/statustick-agent --destination dist
      - name: Push the chart to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm push dist/statustick-agent-*.tgz "oci://${REGISTRY}"
