[package]
name = "statustick-checks"
version = "0.1.0"
edition = "2024"
description = "StatusTick check engine: HTTP, TCP, ping, DNS, TLS certificate, gRPC, mail and MCP checks with the target rules"
license = "Apache-2.0"
repository = "https://github.com/statustick/agent"
publish = false

[features]
# A second TLS attempt with OpenSSL (built from source and linked statically) for servers rustls cannot talk to.
legacy-tls = ["dep:openssl", "dep:tokio-openssl", "dep:hyper", "dep:hyper-util"]

[dependencies]
base64 = "0.23.1"
brotli-decompressor = "6.0.1"
bytes = "1.12.1"
chrono = "0.4.45"
dns-lookup = "4.0.2"
flate2 = "1.1.10"
futures-util = "0.3.34"
h2 = "0.4.20"
hex = "0.4.3"
hickory-resolver = "0.26.3"
http = "1.5.0"
hyper = { version = "1.12.0", features = ["client", "http1"], optional = true }
hyper-util = { version = "0.1.21", features = ["tokio"], optional = true }
ipnet = "2.12.2"
libc = "0.2.190"
openssl = { version = "0.10", features = ["vendored"], optional = true }
percent-encoding = "2.3.2"
rand = "0.10.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["http2", "rustls-no-provider", "stream"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = "1.15.1"
webpki = { package = "rustls-webpki", version = "0.103.15", default-features = false, features = ["ring", "std"] }
ruzstd = "0.9.0"
ryu-js = "1.0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.11.0"
socket2 = { version = "0.6.5", features = ["all"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "net", "time", "io-util", "macros", "sync", "fs", "process", "signal", "io-std"] }
tokio-openssl = { version = "0.6", optional = true }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
url = "2.5.8"
webpki-root-certs = "1.0.9"
x509-parser = { version = "0.18.1", features = ["verify"] }

[dev-dependencies]
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
openssl = { version = "0.10", features = ["vendored"] }
tokio-openssl = "0.6"
