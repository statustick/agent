[package]
name = "statustick-agent"
version = "1.0.0"
edition = "2024"
description = "StatusTick private-location agent without a browser: one static binary on the statustick-checks crate"
license = "Apache-2.0"
repository = "https://github.com/statustick/agent"
publish = false

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
base64 = "0.23.1"
chrono = "0.4.45"
futures-util = "0.3.34"
hex = "0.4.3"
hmac = "0.13"
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
libc = "0.2.190"
md-5 = "0.11"
mysql_async = { version = "0.37", default-features = false, features = ["minimal-rust", "rustls-tls", "ring"] }
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
percent-encoding = "2.3.2"
rand = "0.10.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["http2", "json", "rustls-no-provider", "stream"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha1 = "0.11"
sha2 = "0.11.0"
socket2 = "0.6.5"
statustick-browser = { path = "../browser" }
statustick-checks = { path = "../checks", features = ["legacy-tls"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "net", "time", "io-util", "macros", "sync", "fs", "signal"] }
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime"] }
tokio-postgres-rustls = "0.14"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tower-service = "0.3"
url = "2.5.8"
x509-parser = "0.18.1"
